name: Release Please

on:
  push:
    branches:
      - main

# Required permissions for GITHUB_TOKEN to create releases and pull requests.
#
# Additionally, "Allow GitHub Actions to create and approve pull requests" must
# be enabled in your repository under Settings > Actions > General.
# See: https://github.com/googleapis/release-please-action?tab=readme-ov-file#workflow-permissions
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    # Skip when running inside the template repository itself
    if: github.repository != 'jpawlowski/hacs.integration_blueprint'
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A personal access token is needed so the release PR triggers the required
          # CI checks; PRs opened with GITHUB_TOKEN never start other workflows
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Merge the release PR on its own once the required checks pass
      - name: Enable auto-merge for the release PR
        if: steps.release.outputs.prs_created == 'true'
        # Parse in the shell: env expressions are evaluated even when the step is skipped,
        # and fromJSON() fails on the empty output when no release PR exists
        run: gh pr merge --auto --squash "$(jq -r .number <<<"$PR_JSON")" --repo "$GITHUB_REPOSITORY"
        env:
          PR_JSON: ${{ steps.release.outputs.pr }}
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
